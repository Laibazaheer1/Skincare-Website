<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Mask | GlowCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    .product-page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-top: 50px;
      align-items: center;
    }
    .product-info h2 {
      font-weight: bold;
    }
    .product-price {
      font-size: 1.5rem;
      margin: 15px 0;
    }
    .rating i {
      color: gold;
    }
    /* Bigger carousel images */
    .product-page .carousel img {
      max-height: 420px;
      object-fit: cover;
    }
    /* Styled input fields */
    .form-select, .form-control {
      max-width: 160px;
      padding: 6px 12px;
      font-size: 0.95rem;
      background-color: #fce4ec; /* light pink */
      border: 1px solid #f497b7;
      border-radius: 8px;
    }
    .form-select:focus, .form-control:focus {
      outline: none;
      box-shadow: 0 0 6px rgba(244, 151, 183, 0.7);
      border-color: #f06292;
    }
    /* Cart Sidebar */
    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -400px;
      width: 350px;
      height: 100%;
      background: #fff;
      box-shadow: -2px 0 5px rgba(0,0,0,0.2);
      transition: right 0.3s ease;
      padding: 20px;
      z-index: 9999;
    }
    .cart-sidebar.active { right: 0; }
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-items { max-height: 400px; overflow-y: auto; margin: 15px 0; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cart-item img { width: 50px; height: 50px; object-fit: cover; margin-right: 10px; }
    /* Footer */
    footer {
      background: #f8c8dc;
      color: #333;
      text-align: center;
      padding: 20px 0;
      margin-top: 40px;
      font-size: 0.95rem;
      border-top: 2px solid #f497b7;
    }
    .navbar-custom {
      background-color: #f8c8dc;
      padding: 09px 0;
      border-bottom: 2px solid #f497b7;
      transition: background-color 0.3s ease;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      position: sticky;
      top: 0;
    }
    .navbar-custom.scrolled {
      background-color: rgba(248, 200, 220, 0.7);
      backdrop-filter: blur(10px);
    }
     .qty-btn {
  width: 30px;
  height: 30px;
  border: none;
  background: #f497b7;
  color: white;
  border-radius: 6px;
  font-size: 18px;
  font-weight: bold;
  line-height: 1;
  cursor: pointer;
}

.qty-number {
  min-width: 20px;
  text-align: center;
  font-weight: 600;
  font-size: 14px;
}

/* Cart item layout */
.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.cart-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.cart-left img {
  width: 45px;
  height: 45px;
  border-radius: 8px;
  object-fit: cover;
}

.cart-title {
  font-weight: 600;
  font-size: 14px;
}

.cart-price {
  font-size: 15px;
  color: #555;
}

.cart-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Remove button */
.remove-btn {
  background-color: red;
  
  border: none;
  font-size: 16px;
  color: #f3eeee;
  cursor: pointer;
}
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <img src="images/log-removebg-preview.png" alt="Logo" class="logo"> GlowCare
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="product.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <!-- Basket Icon -->
        <a href="#" id="cartIcon" class="btn btn-outline-dark position-relative ms-3">
          <i class="fas fa-shopping-basket"></i>
          <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge bg-danger">0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Product Page -->
  <section class="container product-page">
    <!-- Left: Product Image Carousel -->
    <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="images/facemask.jpg" class="d-block w-100 rounded" alt="Face Mask 1">
        </div>
        <div class="carousel-item">
          <img src="images/f2.jpg" class="d-block w-100 rounded" alt="Face Mask 2">
        </div>
        <div class="carousel-item">
          <img src="images/f3.jpg" class="d-block w-100 rounded" alt="Face Mask 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- Right: Product Info -->
    <div class="product-info">
      <h2>GlowCare Face Mask</h2>
      <div class="rating mb-2">
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="fas fa-star"></i>
        <i class="far fa-star"></i>
        <span>(32 reviews)</span>
      </div>
      <p class="product-price">$18.00</p>

      <!-- Options -->
      <div class="mb-3">
        <label class="form-label">Type</label>
        <select class="form-select">
          <option>Clay Mask</option>
          <option>Sheet Mask</option>
          <option>Peel-Off Mask</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input type="number" class="form-control" value="1" min="1">
      </div>

      <button class="btn btn-custom w-100" id="addToCartBtn">Add to Cart</button>
    </div>
  </section>

  <!-- Cart Sidebar -->
  <div id="cartSidebar" class="cart-sidebar">
    <div class="cart-header">
      <h5>Your Cart</h5>
      <button id="closeCart" class="btn-close"></button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <p>Total: $<span id="cartTotal">0</span></p>
      <button id="buyNowBtn" class="btn btn-success w-100">Buy It Now</button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 GlowCare. All rights reserved.</p>
  </footer>

  <script>
    // ===== Cart Logic =====
    
  // ===== Cart Logic =====
 let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartIcon = document.getElementById("cartIcon");
const cartSidebar = document.getElementById("cartSidebar");
const closeCart = document.getElementById("closeCart");
const addToCartBtn = document.getElementById("addToCartBtn");
const cartItems = document.getElementById("cartItems");
const cartTotal = document.getElementById("cartTotal");
const cartCount = document.getElementById("cartCount");

// Render Cart Function
function renderCart() {
  cartItems.innerHTML = ""; // Clear previous items
  let total = 0;

  cart.forEach((item, index) => {
    total += item.price * item.quantity;

    const cartItem = document.createElement("div");
    cartItem.classList.add("cart-item");
    cartItem.innerHTML = `
      <div class="cart-left">
        <img src="${item.image}">
        <div>
          <div class="cart-title">${item.name}</div>
          <div class="cart-price">$${item.price.toFixed(2)}</div>
        </div>
      </div>
      <div class="cart-right">
        <button class="qty-btn minus">−</button>
        <span class="qty-number">${item.quantity}</span>
        <button class="qty-btn plus">+</button>
        <button class="remove-btn">✕</button>
      </div>
    `;
    cartItems.appendChild(cartItem);

    // Event Listeners
    cartItem.querySelector(".plus").addEventListener("click", () => {
      cart[index].quantity++;
      saveAndRender();
    });

    cartItem.querySelector(".minus").addEventListener("click", () => {
      if (cart[index].quantity > 1) {
        cart[index].quantity--;
      } else {
        cart.splice(index, 1);
      }
      saveAndRender();
    });

    cartItem.querySelector(".remove-btn").addEventListener("click", () => {
      cart.splice(index, 1);
      saveAndRender();
    });
  });

  cartTotal.innerText = total.toFixed(2);
  cartCount.innerText = cart.length;
}

// Save cart to localStorage and re-render
function saveAndRender() {
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

// Add to Cart
addToCartBtn?.addEventListener("click", () => {
  const name = document.querySelector(".product-info h2").innerText;
  const price = parseFloat(document.querySelector(".product-price").innerText.replace("$", ""));
  const image = document.querySelector(".carousel-item.active img").src;
  const quantity = parseInt(document.querySelector('input[type="number"]').value);

  const existingIndex = cart.findIndex(item => item.name === name);
  if (existingIndex !== -1) {
    cart[existingIndex].quantity += quantity;
  } else {
    cart.push({ name, price, image, quantity });
  }

  saveAndRender();
  cartSidebar.classList.add("active");
});

// Open / Close Cart
cartIcon.addEventListener("click", () => cartSidebar.classList.add("active"));
closeCart.addEventListener("click", () => cartSidebar.classList.remove("active"));

// Initial render
renderCart();

    // Navbar scroll effect
    window.addEventListener("scroll", function() {
      const navbar = document.querySelector(".navbar");
      if (window.scrollY > 50) {
        navbar.classList.add("transparent");
      } else {
        navbar.classList.remove("transparent");
      }
    });
    const buyNowBtn = document.getElementById("buyNowBtn");

buyNowBtn.addEventListener("click", () => {
  // Redirect to shipping page
  window.location.href = "shipping.html";
});

  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
